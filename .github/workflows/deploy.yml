name: Deploy para Cloudflare Pages

# Publica o site a cada push na main. O projeto Pages e do tipo Direct
# Upload, entao o deploy sai daqui via wrangler em vez da integracao Git
# nativa (que a Cloudflare so permite em projetos criados ja conectados).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # As NEXT_PUBLIC_* sao embutidas no BUNDLE durante o build, nao lidas em
      # runtime. Cadastra-las no painel do Cloudflare Pages nao adianta nada
      # aqui: este job faz o build e sobe o `out/` pronto, entao o painel do
      # Pages nunca ve o processo. Elas precisam existir COMO VARIAVEIS DO
      # ACTIONS (Settings > Secrets and variables > Actions > Variables).
      #
      # Sao `vars` e nao `secrets` de proposito: os dois valores vao para o
      # JavaScript que todo visitante baixa. Guarda-los como secret so
      # dificultaria a revisao sem esconder nada de ninguem.
      - name: Conferir as variaveis de build
        run: |
          faltando=""
          [ -n "${{ vars.NEXT_PUBLIC_CRM_URL }}" ] || faltando="$faltando NEXT_PUBLIC_CRM_URL"
          [ -n "${{ vars.NEXT_PUBLIC_WEBCHAT_TOKEN }}" ] || faltando="$faltando NEXT_PUBLIC_WEBCHAT_TOKEN"
          if [ -n "$faltando" ]; then
            echo "::error::Variaveis ausentes:$faltando"
            echo "Sem elas o build sai com o widget de chat morto -- ele some da"
            echo "pagina sem erro nenhum, e o deploy passa como sucesso."
            echo "Cadastre em Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - run: pnpm build
        env:
          NEXT_PUBLIC_CRM_URL: ${{ vars.NEXT_PUBLIC_CRM_URL }}
          NEXT_PUBLIC_WEBCHAT_TOKEN: ${{ vars.NEXT_PUBLIC_WEBCHAT_TOKEN }}

      # Chamada direta ao wrangler em vez de cloudflare/wrangler-action: a
      # action fixa o wrangler 3.90 e instala com pnpm, que falha em
      # ERR_PNPM_IGNORED_BUILDS por causa dos scripts do esbuild e do workerd.
      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ff459b1c4bd0109bb9e2956ac0426aee
        run: npx -y wrangler@4 pages deploy out --project-name=mytek-site --branch=main
